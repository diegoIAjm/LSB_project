<div class="container">

  <h2>Registrar Usuario</h2>

  <button class="btn-volver" (click)="volverUsuarios()">← Volver al listado</button>

  <div class="formulario">

    <p class="mensaje-exito" *ngIf="mensaje">{{ mensaje }}</p>
    <p class="mensaje-error" *ngIf="error">{{ error }}</p>

    <input type="text" placeholder="Nombre" [(ngModel)]="usuario.nombre" />
    <input type="text" placeholder="Apellido" [(ngModel)]="usuario.apellido" />
    <input type="email" placeholder="Correo electrónico" [(ngModel)]="usuario.email" />
    <input type="text" placeholder="Cédula de Identidad (CI)" [(ngModel)]="usuario.ci" />
    <input type="password" placeholder="Contraseña" [(ngModel)]="usuario.password" />

    <select [(ngModel)]="usuario.rol">
    <option [ngValue]="0">Seleccionar rol</option>
    <option [ngValue]="1">Administrador</option>
    <option [ngValue]="2">Docente</option>
    <option [ngValue]="3">Estudiante</option>
    </select>

        <div *ngIf="usuario.rol === 3" class="campo-especifico">
      <label>Nivel Actual:</label>
      <select [(ngModel)]="usuario.nivel_actual" [disabled]="cargando">
        <option [value]="''">Seleccionar nivel</option>
        <option *ngFor="let nivel of niveles" [value]="nivel">{{ nivel }}</option>
      </select>
    </div>

    <div *ngIf="usuario.rol === 2" class="campo-especifico">
      <label>Especialidad:</label>
      <input type="text" placeholder="Ej: Matemáticas, Inglés, Programación" [(ngModel)]="usuario.especialidad" [disabled]="cargando" />
    </div>

    <button [disabled]="cargando" (click)="crearUsuario()">
      {{ cargando ? 'Creando...' : 'Registrar' }}
    </button>
  </div>

</div>
