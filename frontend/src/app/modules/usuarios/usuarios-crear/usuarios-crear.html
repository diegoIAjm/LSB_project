<div class="container">

  <h2>Registrar Usuario</h2>

  <button class="btn-volver" (click)="volverUsuarios()">← Volver al listado</button>

  <div class="formulario">

    <p class="mensaje-exito" *ngIf="mensaje">{{ mensaje }}</p>
    <p class="mensaje-error" *ngIf="error">{{ error }}</p>

    <input type="text" placeholder="Nombre" [(ngModel)]="usuario.nombre" />
    <input type="text" placeholder="Apellido" [(ngModel)]="usuario.apellido" />
    <input type="email" placeholder="Correo electrónico" [(ngModel)]="usuario.email" />
    <input type="text" placeholder="Cédula de Identidad (CI)" [(ngModel)]="usuario.ci" />
    <input type="password" placeholder="Contraseña" [(ngModel)]="usuario.password" />

    <select [(ngModel)]="usuario.rol">
    <option [value]="0">Seleccionar rol</option>
    <option [value]="1">Administrador</option>
    <option [value]="2">Docente</option>
    <option [value]="3">Estudiante</option>
    </select>

    <button [disabled]="cargando" (click)="crearUsuario()">
      {{ cargando ? 'Creando...' : 'Registrar' }}
    </button>
  </div>

</div>
