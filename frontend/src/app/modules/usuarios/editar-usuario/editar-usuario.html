<div class="container">
  <h2>Editar Usuario</h2>

  <button class="btn-volver" (click)="volverUsuarios()">← Volver al listado</button>

  <!-- Estado de carga -->
  <div *ngIf="cargandoDatos" class="loading">
    <div class="spinner"></div>
    Cargando datos del usuario...
  </div>

  <!-- Formulario de edición -->
  <div class="formulario" *ngIf="!cargandoDatos">
    <p class="mensaje-exito" *ngIf="mensaje">{{ mensaje }}</p>
    <p class="mensaje-error" *ngIf="error">{{ error }}</p>

    <div class="campo">
      <label>Nombre</label>
      <input 
        type="text" 
        placeholder="Nombre" 
        [(ngModel)]="usuario.nombre" 
        [disabled]="cargando" />
    </div>

    <div class="campo">
      <label>Apellido</label>
      <input 
        type="text" 
        placeholder="Apellido" 
        [(ngModel)]="usuario.apellido" 
        [disabled]="cargando" />
    </div>

    <div class="campo">
      <label>Correo electrónico</label>
      <input 
        type="email" 
        placeholder="Correo electrónico" 
        [(ngModel)]="usuario.email" 
        [disabled]="cargando" />
    </div>

    <div class="campo">
      <label>Cédula de Identidad (CI)</label>
      <input 
        type="text" 
        placeholder="Cédula de Identidad (CI)" 
        [(ngModel)]="usuario.ci"
        [disabled]="cargando" />
    </div>

    <div class="campo">
      <label>Rol</label>
      <select [(ngModel)]="usuario.rol" [disabled]="cargando">
        <option [ngValue]="0">Seleccionar rol</option>
        <option [ngValue]="1">Administrador</option>
        <option [ngValue]="2">Docente</option>
        <option [ngValue]="3">Estudiante</option>
      </select>
    </div>

    <div *ngIf="usuario.rol === 3" class="campo-especifico">
      <label>Nivel Actual:</label>
      <select [(ngModel)]="usuario.nivel_actual" [disabled]="cargando">
        <option [value]="''">Seleccionar nivel</option>
        <option *ngFor="let nivel of niveles" [value]="nivel">{{ nivel }}</option>
      </select>
    </div>

    <div *ngIf="usuario.rol === 2" class="campo-especifico">
      <label>Especialidad:</label>
      <input type="text" placeholder="Ej: Matemáticas, Inglés, Programación" [(ngModel)]="usuario.especialidad" [disabled]="cargando" />
    </div>

    <button class="btn-actualizar" [disabled]="cargando" (click)="actualizarUsuario()">
      <span *ngIf="cargando" class="spinner"></span>
      {{ cargando ? 'Actualizando...' : 'Actualizar Usuario' }}
    </button>
  </div>
</div>
