<header class="header">

  <!-- LEFT -->
  <div class="left">
    <button class="toggle-btn" (click)="toggleSidebar.emit()">
      ☰
    </button>

    <div class="search">
      <input type="text" placeholder="Buscar..." />
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <button class="notification-btn">🔔</button>

    <div class="user">
      <div class="avatar">{{ usuario.nombre.charAt(0) }}</div>
      <div class="info">
        <span class="name">{{ usuario.nombre }}</span>
        <span class="role">{{ usuario.rol }}</span>
      </div>
    </div>

    <!-- 🔹 BOTÓN DE CERRAR SESIÓN ESTILO HEADER (icono redondo) -->
    <button class="logout-header" (click)="logout()" title="Cerrar sesión">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>

</header>
