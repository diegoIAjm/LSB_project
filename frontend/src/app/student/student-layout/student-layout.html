<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar" [class.sidebar-collapsed]="!sidebarOpen">
    <div class="sidebar-header">
      <div class="logo" *ngIf="sidebarOpen">
        <span class="logo-icon">🎓</span>
        <span class="logo-text">EduLearn</span>
      </div>
      <div class="logo-icon-only" *ngIf="!sidebarOpen">
        <span class="logo-icon">🎓</span>
      </div>
      <button class="toggle-btn" (click)="toggleSidebar()">
        {{ sidebarOpen ? '◀' : '▶' }}
      </button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/student/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span class="nav-label" *ngIf="sidebarOpen">Inicio</span>
      </a>
      <a routerLink="/student/mis-cursos" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📚</span>
        <span class="nav-label" *ngIf="sidebarOpen">Mis Cursos</span>
      </a>
      <a routerLink="/student/diccionario" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📖</span>
        <span class="nav-label" *ngIf="sidebarOpen">Diccionario</span>
      </a>
      <a routerLink="/student/duolingo" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🦉</span>
        <span class="nav-label" *ngIf="sidebarOpen">Duolingo</span>
      </a>
      <a routerLink="/student/conversation" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">💬</span>
        <span class="nav-label" *ngIf="sidebarOpen">Práctica IA</span>
      </a>
      <a routerLink="/student/evaluation" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📝</span>
        <span class="nav-label" *ngIf="sidebarOpen">Modo Evaluación</span>
      </a>
    </nav>

    <div class="sidebar-footer" *ngIf="sidebarOpen">
      <div class="user-info">
        <div class="user-avatar">
          <img src="https://randomuser.me/api/portraits/women/68.jpg" alt="Avatar">
        </div>
        <div class="user-details">
          <span class="user-name">María González</span>
          <span class="user-role">Estudiante</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" [class.content-expanded]="!sidebarOpen">
    <header class="top-bar">
      <div class="welcome-message">
        <h1>¡Hola, María! 👋</h1>
        <p>¿Lista para seguir aprendiendo hoy?</p>
      </div>
      <div class="header-actions">
        <button class="notification-btn">🔔</button>
        <button class="logout-header" (click)="logout()" title="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
        <div class="user-menu">
          <img src="https://randomuser.me/api/portraits/women/68.jpg" alt="Avatar" class="avatar">
        </div>
      </div>
    </header>

    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
