<!-- src/app/student/diccionario/diccionario.html -->
<div class="diccionario-container">
  <!-- Sección del Avatar 3D -->
  <div class="avatar-section">
    <div class="avatar-header">
      <h3>🤖 Avatar Interactivo</h3>
      <p *ngIf="senaActual">🎬 Reproduciendo: <strong>{{ senaActual }}</strong></p>
      <p>Arrastra para rotar | Rueda para zoom</p>
    </div>
    <div #avatarContainer class="avatar-canvas"></div>
  </div>

  <!-- Sección del Diccionario -->
  <div class="diccionario-section">
    <div class="diccionario-header">
      <h2>📚 Diccionario de Señas</h2>
      <p>Aprende nuevas palabras con nuestro avatar 3D</p>
    </div>

    <!-- Filtros -->
    <div class="filtros">
      <div class="campo-busqueda">
        <input 
          type="text" 
          placeholder="🔍 Buscar palabra..." 
          [(ngModel)]="terminoBusqueda"
          (input)="filtrarPalabras()"
        />
      </div>
      
      <div class="campo-categoria">
        <select [(ngModel)]="categoriaSeleccionada" (change)="filtrarPalabras()">
          <option [value]="0">Todas las categorías</option>
          <option *ngFor="let cat of categorias" [value]="cat.id">{{ cat.nombre }}</option>
        </select>
      </div>
      
      <button class="btn-limpiar" (click)="limpiarFiltros()">🗑️ Limpiar</button>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="loading">
      <div class="spinner"></div>
      <p>Cargando señas...</p>
    </div>

    <!-- Lista de palabras -->
    <div class="palabras-grid" *ngIf="!loading">
      <div class="palabra-card" *ngFor="let palabra of palabrasFiltradas" (click)="seleccionarPalabra(palabra)">
        <div class="palabra-icon">📖</div>
        <div class="palabra-termino">{{ palabra.nombre }}</div>
        <div class="palabra-categoria">{{ getNombreCategoria(palabra.categoria_id) }}</div>
      </div>
      
      <div *ngIf="palabrasFiltradas.length === 0" class="sin-resultados">
        <p>No se encontraron palabras</p>
      </div>
    </div>
  </div>
</div>
